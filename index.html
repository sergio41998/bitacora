<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
#bx{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#141A1F; --muted:#5B6870; --line:#D4DCD9;
  --accent:#2742E8; --accent-soft:#E3E8FF; --accent-ink:#FFFFFF;
  --income:#0E8656; --expense:#CF4436; --save:#AE7A12; --warn:#B87F04;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
#bx{
  --bg:#0D1215; --surface:#151C20; --surface-2:#1D262B; --ink:#E6ECEE; --muted:#8C9AA2; --line:#28333A;
  --accent:#8193FF; --accent-soft:#1F2647; --accent-ink:#0D1215;
  --income:#3CC48A; --expense:#FF7A6B; --save:#E6B54A; --warn:#F0B429; color-scheme:dark}}
#bx, #bx *{box-sizing:border-box}
html,body{overflow:hidden!important}
#bx{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#bx button,#bx input,#bx select,#bx textarea{font:inherit;color:inherit}
#bx button{cursor:pointer}
#bx :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bx .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#bx .wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bx header.top{position:relative;flex:none;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#bx header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
#bx .brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;flex:1;min-width:0}
#bx .brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bx .monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
#bx .monthnav button{border:0;background:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
#bx .monthnav button:hover{background:var(--surface-2);color:var(--ink)}
#bx .monthnav span{font-weight:700;font-size:14px;min-width:112px;text-align:center;text-transform:capitalize}
#bx main{padding-block:16px 96px}
#bx main > .wrap{display:flex;flex-direction:column;gap:22px}
#bx h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em;text-wrap:balance}
#bx .sec{display:flex;flex-direction:column;gap:10px}
#bx .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#bx .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bx .muted{color:var(--muted)}
#bx .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
#bx .banner{border-radius:12px;padding:10px 14px;font-size:13px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#bx .banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
#bx .hero{display:flex;flex-direction:column;gap:4px;padding-top:4px}
#bx .hero .big{font-family:var(--mono);font-weight:700;font-size:clamp(38px,11vw,52px);letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
#bx .delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;width:fit-content}
#bx .delta.up{color:var(--expense);background:color-mix(in srgb,var(--expense) 13%,transparent)}
#bx .delta.down{color:var(--income);background:color-mix(in srgb,var(--income) 13%,transparent)}
#bx .delta.flat{color:var(--muted);background:var(--surface-2)}
#bx .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#bx .kpis > div{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
#bx .kpis .v{font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bx .pace{font-size:13px;color:var(--muted)}
#bx .pace b{color:var(--ink)}
#bx .rows{display:flex;flex-direction:column}
#bx .row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
#bx .row:last-child{border-bottom:0}
#bx .dot{width:10px;height:10px;border-radius:3px}
#bx .row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bx .row .sub{font-size:12px;color:var(--muted)}

<script>
(() => {
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);

const TODAY = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

    currency:"EUR",

      g("regalos","Regalos",false,12), g("educacion","Educación",false,13), g("otros","Otros",false,10),

      {id:"extras",name:"Extras",kind:"ingreso",fixed:false,budget:0,color:"#1FA8C9"},
      {id:"otros-ing",name:"Otros ingresos",kind:"ingreso",fixed:false,budget:0,color:"#5B7083"}

const S = {
  ready:false, mode:"loading", settings:defaultSettings(), settingsStored:false, months:{},
  view:"resumen", ym:CUR_YM, ana:"mes", cmpA:CUR_YM, cmpB:addM(CUR_YM,-1), yA:+CUR_YM.slice(0,4), yB:+CUR_YM.slice(0,4)-1,

const txOf = ym => S.months[ym] || [];
const allTx = () => Object.values(S.months).flat();
const monthsWithData = () => Object.keys(S.months).filter(k => S.months[k].length).sort();

function totals(ym){
  const t = {inc:0, exp:0, sav:0, fixed:0, variable:0, byCat:{}, n:0};
  for (const x of txOf(ym)){
    t.n++;
    if (x.type === "gasto"){ t.exp += x.amount; t.byCat[x.cat] = (t.byCat[x.cat]||0) + x.amount; (catById(x.cat)?.fixed ? t.fixed += x.amount : t.variable += x.amount); }

}

/* ---------- storage ---------- */
let col = null, dbRef = null;
const dirty = new Set(); let flushTimer = null, flushing = false;

    if (S.mode === "local"){ try{ localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, months:S.months})); }catch(e){} dirty.clear(); S.settingsStored = true; return; }

}

}
async function boot(){

  col.onSnapshot(applySnapshot, err => { S.dbErr = "Se perdió la conexión con tus datos. Recarga la página."; render(); });
}

/* ---------- mutations ---------- */
function upsertTx(tx, oldYM){
  const ym = tx.date.slice(0,7);
  if (oldYM && S.months[oldYM]){ S.months[oldYM] = S.months[oldYM].filter(x => x.id !== tx.id); markDirty("m-"+oldYM); }
  const arr = (S.months[ym] || []).filter(x => x.id !== tx.id); arr.push(tx);
  arr.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  S.months[ym] = arr; markDirty("m-"+ym);
}
function deleteTx(id){
  for (const [ym, arr] of Object.entries(S.months)) if (arr.some(x => x.id === id)){ S.months[ym] = arr.filter(x => x.id !== id); markDirty("m-"+ym); }
}
function saveSettings(){ markDirty("settings"); }
function bulkFilter(pred){
  for (const [ym, arr] of Object.entries(S.months)){ const next = arr.filter(x => !pred(x)); if (next.length !== arr.length){ S.months[ym] = next; markDirty("m-"+ym); } }
}

/* ---------- demo data ---------- */
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadDemo(){
  const R = mulberry(42); const rr = (a,b) => Math.round((a + R()*(b-a))*100)/100;
  const add = (ym, day, type, amount, cat, note, pot) => { const d = Math.min(day, daysIn(ym)); const date = `${ym}-${pad(d)}`; if (date > TODAY) return; upsertTx({id:uid(), date, type, amount, cat, pot, note, demo:true}); };
  for (let i = 15; i >= 0; i--){
    const ym = addM(CUR_YM, -i), mo = +ym.slice(5);
    add(ym, 28, "ingreso", 3850 + (i < 10 ? 120 : 0), "nomina", "Nómina");
    if (mo === 6 || mo === 12) add(ym, 28, "ingreso", 3400, "extras", "Paga extra");
    add(ym, 1, "gasto", 1150, "vivienda", "Alquiler");
    add(ym, 5, "gasto", rr(85,140), "suministros", "Luz y gas");
    add(ym, 7, "gasto", 39.9, "suministros", "Internet y móvil");
    add(ym, 3, "gasto", 27.97, "suscripciones", "Streaming y música");
    add(ym, 2, "gasto", 89, "salud", "Box de CrossFit");
    add(ym, 15, "gasto", 64.5, "seguros", "Seguro de coche");
    for (let k = 0; k < 7 + Math.floor(R()*4); k++) add(ym, 1+Math.floor(R()*28), "gasto", rr(18,95), "super", ["Rewe","Lidl","Edeka","Aldi"][Math.floor(R()*4)]);
    for (let k = 0; k < 3 + Math.floor(R()*5); k++) add(ym, 1+Math.floor(R()*28), "gasto", rr(14,70), "restaurantes", ["Cena","Comida fuera","Café y brunch"][Math.floor(R()*3)]);
    add(ym, 10, "gasto", rr(55,95), "coche", "Gasolina"); if (R() > .5) add(ym, 22, "gasto", rr(45,80), "coche", "Gasolina");
    for (let k = 0; k < 2 + Math.floor(R()*3); k++) add(ym, 1+Math.floor(R()*28), "gasto", rr(10,60), "ocio", ["Cine","Concierto","Libros","Videojuego"][Math.floor(R()*4)]);
    if (R() > .55) add(ym, 1+Math.floor(R()*27), "gasto", rr(30,140), "ropa", "Ropa");
    if ([4,7,8,12].includes(mo)) add(ym, 12, "gasto", rr(350,900), "viajes", mo === 12 ? "Vuelos Navidad" : "Escapada");
    if (mo === 12) add(ym, 18, "gasto", rr(150,260), "regalos", "Regalos de Navidad");
    add(ym, 29, "ahorro", 400, null, "Aportación mensual", "emergencia");
  }
  render(); toast("Datos de ejemplo cargados");
}

const charts = {}; let pendingCharts = [];

function baseOpts(extra = {}){

  return Object.assign({
    responsive:true, maintainAspectRatio:false, animation:{duration:window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 350},

function flushCharts(){
  for (const k in charts){ charts[k].destroy(); delete charts[k]; }

  Chart.defaults.font.family = "Manrope";
  for (const [id, cfg] of pendingCharts){ const el = document.getElementById(id); if (el) charts[id] = new Chart(el, cfg); }

  { let le = null; try{ le = localStorage.getItem(LS_KEY + "-export"); }catch(e){}

    if (allTx().some(x => !x.demo) && (days == null || days >= 30)) h += `<div class="banner warn"><span>${days == null ? "Aún no has hecho ninguna copia de seguridad." : `Tu última copia es de hace ${days} días.`} Tus datos solo están en este dispositivo.</span><button class="linkbtn" data-act="export">Exportar copia</button></div>`; }

function emptyState(){

}
function deltaPill(cur, prev, label){
  if (!prev) return `<span class="delta flat">sin datos de ${esc(label)}</span>`;
  const d = (cur - prev) / prev; const cls = Math.abs(d) < .02 ? "flat" : d > 0 ? "up" : "down";
  return `<span class="delta ${cls}">${d > 0 ? "▲" : d < 0 ? "▼" : "●"} ${pct(d)} vs ${esc(label)} <span class="num" style="font-weight:600">(${d>0?"+":""}${money(cur-prev)})</span></span>`;
}

function vAnalisis(){

      h += `<div class="cmp"><span class="dot" style="background:${c.color}"></span><div style="min-width:0"><div class="name" style="font-weight:600">${esc(c.name)}</div><div class="vals">${money(a)} vs ${money(b)}</div></div><div class="d ${v>0?"up-t":v<0?"down-t":""}">${v>0?"+":""}${money(v)}<div class="vals" style="text-align:right">${b ? pct(v/b) : "nuevo"}</div></div></div>`; }

    const limit = (S.yA === +CUR_YM.slice(0,4) || S.yB === +CUR_YM.slice(0,4)) ? +CUR_YM.slice(5) : 12;
    const ser = y => Array.from({length:12}, (_,i) => totals(`${y}-${pad(i+1)}`));
    const sA = ser(S.yA), sB = ser(S.yB);
    const sum = (s, k) => s.slice(0, limit).reduce((a,t) => a + t[k], 0);
    const eA = sum(sA,"exp"), eB = sum(sB,"exp"), iA = sum(sA,"inc"), iB = sum(sB,"inc");
    h += `<div class="pace">${limit < 12 ? `Comparando el mismo periodo: <b>enero–${esc(monthName(`2000-${pad(limit)}`))}</b>${limit === +CUR_YM.slice(5) ? " (el mes actual aún está en curso)" : ""}.` : "Años completos."}</div>`;

    const labels = Array.from({length:12}, (_,i) => cap(monthName(`2000-${pad(i+1)}`,"short").replace(".","")));
    const cutA = S.yA === +CUR_YM.slice(0,4) ? +CUR_YM.slice(5) : 12, cutB = S.yB === +CUR_YM.slice(0,4) ? +CUR_YM.slice(5) : 12;

function parseAmount(s){
  if (typeof s === "number") return s;
  s = String(s ?? "").trim(); if (!s) return NaN;
  let neg = /^\(.*\)$/.test(s) || /-/.test(s.replace(/e-/i,""));
  s = s.replace(/[^\d,.]/g, "");
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1){ s = lc > ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if (lc > -1){ s = /,\d{1,2}$/.test(s) ? s.replace(/,(?=\d{3}(\D|$))/g,"").replace(",",".") : s.replace(/,/g,""); }
  else if (ld > -1 && /\.\d{3}$/.test(s) && (s.match(/\./g)||[]).length >= 1 && !/\.\d{1,2}$/.test(s)){ s = s.replace(/\./g,""); }
  const v = parseFloat(s); return isNaN(v) ? NaN : (neg ? -v : v);
}

function splitTitle(raw){
  const m = String(raw).match(/^(.*?)[\s:–-]*(-?\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|-?\d+(?:[.,]\d{1,2})?)\s*(?:€|eur|euros|chf|fr)?\s*$/i);
  if (!m || !m[1].trim()) return {title: String(raw).trim(), amount: null};
  const a = Math.abs(parseAmount(m[2])); return {title: m[1].trim(), amount: a > 0 ? a : null};
}
const STOP = new Set(["de","del","la","el","los","las","con","para","por","en","y","a","al","un","una","the","und","der","die","das"]);

/* Aprende de tus propios movimientos: misma nota exacta, o palabras que casi siempre van a la misma categoría */
function classifyLocal(title){
  const nt = norm(title); const exact = {}, byWord = {}; const ws = new Set(words(title));
  for (const x of allTx()){
    if (!x.note || x.type === "ahorro" || !catById(x.cat)) continue;
    const k = x.type + "|" + x.cat;
    if (norm(x.note) === nt) exact[k] = (exact[k]||0) + 1;
    else for (const w of words(x.note)) if (ws.has(w)) byWord[k] = (byWord[k]||0) + 1;
  }
  const pick = (o, minN, minShare) => { const e = Object.entries(o).sort((a,b) => b[1]-a[1]); if (!e.length) return null; const tot = e.reduce((a,[,v])=>a+v,0); if (e[0][1] < minN || e[0][1]/tot < minShare) return null; const [type, cat] = e[0][0].split("|"); return {type, cat}; };
  return pick(exact, 1, .6) || pick(byWord, 2, .75);
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const delim = [";", ",", "\t", "|"].map(d => [d, first.split(d).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); f = ""; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row);
  return {rows, delim};
}
function parseDate(s, fmt){
  s = String(s||"").trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){
    let [a, b, y] = [+m[1], +m[2], m[3]]; if (y.length === 2) y = "20" + y;
    const [d, mo] = fmt === "mdy" ? [b, a] : [a, b];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${y}-${pad(mo)}-${pad(d)}`;
  }
  return null;
}

async function decryptHistory(pass){
  const r = await fetch("historial.json", {cache:"no-store"}); if (!r.ok) throw {code:"missing"};
  const j = await r.json(); const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(j.salt), iterations:j.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let pt; try{ pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(j.iv)}, key, b(j.data)); }catch(e){ throw {code:"badpass"}; }
  return JSON.parse(new TextDecoder().decode(pt));
}

function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxP ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error("load")); }; document.head.appendChild(s); });
}
function serialToISO(v, XLSX){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : ""; }
/* Exportación con hojas "Gastos", "Ingresos" y "Transferencias" (cuenta principal + otras cuentas) */
function parseMoneyBook(wb, XLSX){
  const get = n => wb.SheetNames.find(s => norm(s) === n);
  const gs = get("gastos"), is = get("ingresos"); if (!gs && !is) return null;
  const items = [], pots = new Set();
  const table = name => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
    const hi = rows.findIndex(r => r.some(v => /fecha/.test(norm(v)))); if (hi < 0) return null;
    const h = rows[hi].map(norm); const col = re => h.findIndex(x => re.test(x));
    return {rows: rows.slice(hi+1), col};
  };
  const toDate = v => typeof v === "number" ? serialToISO(v, XLSX) : parseDate(v, "dmy");
  for (const [name, type] of [[gs,"gasto"],[is,"ingreso"]]){
    if (!name) continue; const t = table(name); if (!t) return null;
    const cD = t.col(/fecha/), cC = t.col(/categ/), cA = t.col(/divisa predeterminada/) >= 0 ? t.col(/^cantidad en la divisa predeterminada/) : t.col(/cantidad|importe/), cN = t.col(/coment|nota/), cT = t.col(/etiqueta/);
    if (cD < 0 || cA < 0) return null;
    for (const r of t.rows){ const date = toDate(r[cD]), amt = parseAmount(r[cA]); if (!date || !(Math.abs(amt) > 0)) continue;
      items.push({date, type, amount:Math.abs(amt), catName:String(r[cC] ?? "").trim(), note:[r[cN], r[cT]].filter(v => String(v).trim()).join(" · ")}); }
  }
  /* Las transferencias entre cuentas no se importan: no son gasto ni ingreso */
  return {items, pots:[...pots]};
}
const FIXED_RE = /fijo|casa|alquiler|hipoteca|pkv|seguro|plazos|cuota|suscrip|luz|internet/;
function commitImport(items){
  const wasEmpty = !allTx().some(x => !x.demo);
  const batch = "imp-" + uid(); let n = 0, dup = 0, created = 0;
  const key = x => [x.date, x.type, Math.round(x.amount*100), x.type === "ahorro" ? x.pot : x.cat, norm(x.note)].join("|");
  const seen = new Map(); for (const x of allTx()){ const k = key(x); seen.set(k, (seen.get(k)||0) + 1); }
  for (const it of items){
    let cat = null, pot = null;
    if (it.type === "ahorro"){
      let p = S.settings.pots.find(p => norm(p.name) === norm(it.potName));
      if (!p){ p = {id:"p-" + uid(), name:it.potName, goal:0, initial:0, color:PALETTE[(S.settings.pots.length*3+3) % PALETTE.length]}; S.settings.pots.push(p); created++; }
      pot = p.id;
    } else if (it.catName){
      cat = S.settings.categories.find(c => c.kind === it.type && norm(c.name) === norm(it.catName))?.id;
      if (!cat){ const nc = {id:"c-" + uid(), name:it.catName, kind:it.type, fixed: it.type === "gasto" && FIXED_RE.test(norm(it.catName)), budget:0, color:PALETTE[S.settings.categories.length % PALETTE.length]}; S.settings.categories.push(nc); cat = nc.id; created++; }
    } else cat = it.type === "gasto" ? (catById("otros") ? "otros" : S.settings.categories.find(c=>c.kind==="gasto")?.id) : (catById("otros-ing") ? "otros-ing" : S.settings.categories.find(c=>c.kind==="ingreso")?.id);
    const tx = {id:uid(), date:it.date, type:it.type, amount:it.amount, cat, pot, note:(it.note||"").slice(0,120), imp:batch};
    const k = key(tx); if (seen.get(k) > 0){ seen.set(k, seen.get(k) - 1); dup++; continue; }
    (S.months[it.date.slice(0,7)] ||= []).push(tx); markDirty("m-"+it.date.slice(0,7)); n++;
  }
  for (const k of Object.keys(S.months)) S.months[k].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (wasEmpty && n){ const used = new Set(allTx().map(x => x.cat)); const defs = new Set(defaultSettings().categories.map(c => c.id)); S.settings.categories = S.settings.categories.filter(c => !defs.has(c.id) || used.has(c.id) || c.id === "otros" || c.id === "otros-ing" || c.budget > 0); created++; }
  S.lastImport = n ? batch : S.lastImport; if (created) saveSettings();
  closeSheet(); render(); toast(`${n} movimientos importados${dup ? ` · ${dup} ya estaban` : ""}${created ? ` · ${created} categorías/botes nuevos` : ""}`);
}
async function exportCSV(){
  const rows = [["fecha","tipo","categoria","bote","importe","nota"]];
  for (const x of allTx().sort((a,b) => a.date < b.date ? -1 : 1)) rows.push([x.date, x.type, catById(x.cat)?.name || "", potById(x.pot)?.name || "", String(x.amount).replace(".",","), x.note || ""]);
  const csv = "﻿" + rows.map(r => r.map(v => /[;"\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v).join(";")).join("\n");
  const name = `bitacora-gastos-${TODAY}.csv`;
  const mark = () => { try{ localStorage.setItem(LS_KEY + "-export", String(Date.now())); }catch(e){} render(); };
  const file = new File([csv], name, {type:"text/csv"});
  try{ if (navigator.canShare?.({files:[file]})){ await navigator.share({files:[file], title:name}); mark(); toast("Copia exportada"); return; } }catch(e){ if (e?.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.getElementById("bx").appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  mark(); toast("Copia descargada");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  switch (a){
    case "month": S.ym = addM(S.ym, +el.dataset.d); render(); break;
    case "new-tx": txSheet(null); break;
    case "edit-tx": { const tx = allTx().find(x => x.id === el.dataset.id); if (tx) txSheet(tx); break; }
    case "close-sheet": closeSheet(); break;
    case "ftype": S.ftype = el.dataset.v; render(); break;
    case "ana": S.ana = el.dataset.v; render(); break;
    case "go": location.hash = el.dataset.v; break;
    case "demo": loadDemo(); break;
    case "clear-demo": bulkFilter(x => x.demo); render(); toast("Datos de ejemplo borrados"); break;
    case "undo-import": { const b = S.lastImport; bulkFilter(x => x.imp === b); S.lastImport = null; render(); toast("Importación deshecha"); break; }
    case "import": importSheet(); break;
    case "load-hist": histSheet(); break;
    case "export": exportCSV(); break;
    case "new-cat": catSheet(null, el.dataset.k); break;
    case "edit-cat": catSheet(catById(el.dataset.id)); break;
    case "new-pot": potSheet(null); break;
    case "edit-pot": potSheet(potById(el.dataset.id)); break;
    case "pot-move": txSheet(null, {type:"ahorro", pot:el.dataset.id, dir:+el.dataset.dir}); break;
    case "dismiss-err": S.dbErr = null; render(); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target; if (t.closest(".sheet")) return;
  if (t.id === "cmpA"){ S.cmpA = t.value; render(); }
  else if (t.id === "cmpB"){ S.cmpB = t.value; render(); }
  else if (t.id === "yA"){ S.yA = +t.value; render(); }
  else if (t.id === "yB"){ S.yB = +t.value; render(); }
  else if (t.id === "currency"){ S.settings.currency = t.value; saveSettings(); render(); }
});
let qT; document.addEventListener("input", e => { if (e.target.id === "q"){ S.q = e.target.value; clearTimeout(qT); qT = setTimeout(render, 200); } });

for (const ev of ["gesturestart","gesturechange"]) document.addEventListener(ev, e => e.preventDefault(), {passive:false});
let lastTouch = 0; document.addEventListener("touchend", e => { const t = Date.now(); if (t - lastTouch < 320 && !e.target.closest("input,textarea,select")) e.preventDefault(); lastTouch = t; }, {passive:false});
route();
boot();
})();
